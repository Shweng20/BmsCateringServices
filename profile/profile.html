<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | BM'S Catering Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="profile.css" />
  <link rel="icon" href="data:,">
</head>
<body>
  <section class="profile-page">
    <div class="profile-overlay"></div>

    <div class="profile-card">
      <div class="profile-topbar">
        <a href="../index.html" class="back-link">← Back to Home</a>
        <button type="button" class="btn btn-soft" id="logoutBtn">Logout</button>
      </div>

      <div class="profile-header">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <div>
          <h1>My Profile</h1>
          <p>Manage your BM’s Catering Services account information.</p>
        </div>
      </div>

      <div class="profile-summary">
        <div class="summary-box">
          <span class="summary-label">Client ID</span>
          <strong id="clientIdText">—</strong>
        </div>
        <div class="summary-box">
          <span class="summary-label">Email Status</span>
          <strong class="success-text">Verified</strong>
        </div>
      </div>

      <form class="profile-form" id="profileForm">
        <div class="form-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" readonly>
          <p class="helper-text">Email cannot be changed here.</p>
        </div>

        <div class="form-group">
          <label for="contact_number">Contact Number</label>
          <input type="text" id="contact_number" required>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" rows="4" required></textarea>
        </div>

        <div class="profile-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <button type="button" class="btn btn-soft" id="refreshBtn">Refresh</button>
        </div>

        <p id="profileMessage" class="profile-message"></p>
      </form>

      <div class="profile-password-box">
        <h3>Change Password</h3>

        <form class="profile-form" id="requestPasswordChangeForm">
          <div class="form-group">
            <label for="current_password">Current Password</label>
            <div class="password-wrap">
              <input type="password" id="current_password" required>
              <button type="button" class="toggle-password" data-target="current_password">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label for="new_password">New Password</label>
            <div class="password-wrap">
              <input type="password" id="new_password" required>
              <button type="button" class="toggle-password" data-target="new_password">Show</button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirm_new_password">Confirm New Password</label>
            <div class="password-wrap">
              <input type="password" id="confirm_new_password" required>
              <button type="button" class="toggle-password" data-target="confirm_new_password">Show</button>
            </div>
          </div>

          <div class="profile-actions">
            <button type="submit" class="btn btn-primary">Send Verification Code</button>
          </div>

          <p id="passwordRequestMessage" class="profile-message"></p>
        </form>

        <form class="profile-form" id="confirmPasswordChangeForm">
          <div class="form-group">
            <label for="password_change_code">Verification Code</label>
            <input type="text" id="password_change_code" placeholder="Enter code sent to your email" required>
          </div>

          <div class="profile-actions">
            <button type="submit" class="btn btn-primary">Confirm Password Change</button>
          </div>

          <p id="passwordConfirmMessage" class="profile-message"></p>
        </form>
      </div>
    </div>
  </section>

  <script src="profile.js"></script>
</body>
</html>
