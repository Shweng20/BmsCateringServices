    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | BM'S Catering Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="adminLogin.css" />
</head>
<body>
  <section class="login-page admin-theme">
    <div class="login-overlay"></div>

    <div class="login-card">
      <a href="/admin-dashboard.html" class="back-link">← Back to Home</a>

      <div class="login-header">
        <h1>Admin Login</h1>
        <p>Login as admin to manage reservations, clients, packages, and system data.</p>
      </div>

      <form class="login-form" id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input type="text" id="adminUsername" placeholder="Enter admin username" required>
        </div>

        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login as Admin</button>
        <p id="adminLoginMessage" class="login-message"></p>
      </form>

      <div class="divider">
        <span>client access</span>
      </div>

      <a href="login.html" class="btn btn-outline btn-block">Go to Client Login</a>
    </div>
  </section>

  <script src="adminLogin.js"></script>
</body>
</html>
